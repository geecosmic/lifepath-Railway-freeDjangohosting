{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <title>Jewish Birthday</title>

  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #111118;
      --bg-card: #13131f;
      --bg-input: #0f0f18;
      --text-primary: #e8e6e1;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-gold: #c9a84c;
      --accent-gold-light: #e0c16c;
      --border-subtle: rgba(255, 255, 255, 0.06);
      --border-gold: rgba(201, 168, 76, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

    /* Hero */
    .page-hero {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 4rem 0 3rem;
      text-align: center;
      position: relative;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-icon {
      width: 64px;
      height: 64px;
      background: rgba(201,168,76,0.1);
      border: 1px solid var(--border-gold);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      color: var(--accent-gold);
      font-size: 1.8rem;
    }
    .page-hero h1 {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .page-hero p {
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto;
      font-size: 1rem;
    }

    /* Result Display */
    .result-hero {
      background: linear-gradient(135deg, rgba(201,168,76,0.08), rgba(201,168,76,0.02));
      border: 1px solid var(--border-gold);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 600px;
      margin: 0 auto 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease;
    }
    .result-hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }
    .result-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
      margin-bottom: 0.75rem;
    }
    .result-date {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.2;
      text-shadow: 0 0 40px rgba(201,168,76,0.2);
    }
    .result-icon {
      font-size: 2.5rem;
      color: var(--accent-gold);
      margin-bottom: 1rem;
      opacity: 0.6;
    }

    /* Form Card */
    .form-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .form-card:hover {
      border-color: var(--border-gold);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .form-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }
    .form-label-custom {
      display: block;
      text-align: left;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
    }
    .form-control-custom {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: var(--text-primary);
      font-size: 1rem;
      text-align: center;
      font-weight: 500;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }
    .form-control-custom:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 4px rgba(201,168,76,0.1);
      background: var(--bg-primary);
    }
    .form-control-custom::-webkit-calendar-picker-indicator {
      filter: invert(0.7);
      cursor: pointer;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--accent-gold), #a88a3a);
      color: #0a0a0f;
      border: none;
      padding: 0.75rem 2.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      letter-spacing: 0.02em;
      width: 100%;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201,168,76,0.3);
      color: #0a0a0f;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 3rem 0 5rem;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  {% include "nav.html" %}

  <!-- Hero -->
  <section class="page-hero fade-in">
    <div class="container position-relative">
      <div class="hero-icon">
        <i class="bi bi-stars"></i>
      </div>
      <h1>Jewish Birthday</h1>
      <p>Discover the Hebrew date of your birth and connect with your soul's calendar.</p>
    </div>
  </section>

  <!-- Content -->
  <section class="content-area">
    <div class="container">
      
      <!-- Result Display -->
      {% if hebrew_birthday %}
      <div class="result-hero fade-in">
        <div class="result-icon"><i class="bi bi-moon-stars-fill"></i></div>
        <div class="result-label">Your Jewish Birthday</div>
        <div class="result-date">{{ hebrew_birthday }}</div>
      </div>
      {% endif %}

      <!-- Form -->
      <div class="form-card fade-in">
        <form method="POST" action="" id="jewish-birth">
          {% csrf_token %}
          
          <div class="mb-4">
            <label for="birthday" class="form-label-custom">
              <i class="bi bi-gift me-1"></i>Enter Your Gregorian Birthday
            </label>
            <input type="date" name="birthday" id="birthday" class="form-control-custom" required>
          </div>

          <button type="submit" class="btn-gold">
            <i class="bi bi-magic me-2"></i>Convert to Hebrew
          </button>
        </form>
      </div>

    </div>
  </section>

  {% include "footer.html" %}

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Your custom JS -->
  <script src="{% static 'js/index.js' %}"></script>

  <!-- Scroll Animation -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  </script>
</body>
</html>
